<!DOCTYPE html>
<html>
<head>
    <title>signup</title>
    <style>
        body {
        background-color: #89c0e0; 
        }

        div.dialog{
            border: 2px double black;
            background: #bbe7f0;
            padding-top: 0em;
            padding-left: 1em;
            padding-right: 1em;
            padding-bottom: 1em;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            margin: auto;
            width: 40vw;
            height: 40vh;
            overflow: auto;
            box-shadow: 1em 1em 0.5em rgba(0,0,0,0.5);
            z-index: 10;
        }

        .title{
            font-weight: bold;
            text-align: center;
            margin-bottom: 1em;
            background: blue;
            color: white;
            padding: 0.5em;
        }

        div.button{
            border: 3px outset;
            margin: 1em;
            padding: 1em;
            background: lightgrey;
            text-align: center;
        }
    </style>
</head>
<body>
    
    <div class="dialog">
        <div class="title">Sign Up Page</div>
        <span>Email: </span>
        <input id="email" size=10></input><br><br>

        <span>Name: </span>
        <input id="name" size=10></input><br><br>

        <span>Password: </span>
        <input id="pass" type=”password” size=10></input><br><br>

        <span>Birthday: </span>
        <input id="bday" type=”date”></input><br><br>

        <button onclick="check()">Sign Up</button>
        <script src="/html/signup.js"></script>
    </div>
    
</body>

</html>
